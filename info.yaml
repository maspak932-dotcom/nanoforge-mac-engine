# Tiny Tapeout project information
project:
  title:        "Nano-Forge 4-Lane MAC Engine"
  author:       "Md Aspak"
  discord:      ""
  description:  "Parallel 8-bit AI MAC Engine with saturating accumulators"
  language:     "Verilog"
  clock_hz:     0

  tiles: "2x2"

  top_module:  "tt_um_nanoforge_mac"

  source_files:
    - "tt_um_nanoforge_mac.v"

pinout:
  ui[0]: "data_in_0"
  ui[1]: "data_in_1"
  ui[2]: "data_in_2"
  ui[3]: "data_in_3"
  ui[4]: "data_in_4"
  ui[5]: "data_in_5"
  ui[6]: "data_in_6"
  ui[7]: "data_in_7"

  uo[0]: "read_byte_0"
  uo[1]: "read_byte_1"
  uo[2]: "read_byte_2"
  uo[3]: "read_byte_3"
  uo[4]: "read_byte_4"
  uo[5]: "read_byte_5"
  uo[6]: "read_byte_6"
  uo[7]: "read_byte_7"

  uio[0]: "overflow_flag (output)"
  uio[1]: "cmd_0"
  uio[2]: "cmd_1"
  uio[3]: "cmd_2"
  uio[4]: "lane_sel_0"
  uio[5]: "lane_sel_1"
  uio[6]: "byte_sel_0"
  uio[7]: "valid"

yaml_version: 6
